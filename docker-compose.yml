services:  
  urlshortener:  
    build: .  
    ports:  
      - "8080:8080"  
    environment:  
      - MONGO_URI=mongodb://mongo:password@mongo:27017  
      - REDIS_URL=redis://:password@redis:6379  
    depends_on:  
      - redis
  
  redis:  
    image: redis:latest  
    ports:  
      - "6379:6379"  
    environment:  
      - REDIS_PASSWORD=password  
    command: ["redis-server", "--requirepass", "password"]  
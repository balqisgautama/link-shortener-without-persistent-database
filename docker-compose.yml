services:  
  urlshortener:  
    build: .  
    ports:  
      - "8080:8080"  
    environment:  
      - MONGO_URI=mongodb://mongo:password@mongo:27017  
      - REDIS_URL=redis://:password@redis:6379  
    depends_on:  
      - mongo  
      - redis  
  
  mongo:  
    image: mongo:latest  
    ports:  
      - "27017:27017"  
    environment:  
      - MONGO_INITDB_ROOT_USERNAME=user  
      - MONGO_INITDB_ROOT_PASSWORD=password  
    volumes:  
      - mongo_data:/data/db  
  
  redis:  
    image: redis:latest  
    ports:  
      - "6379:6379"  
    environment:  
      - REDIS_PASSWORD=password  
    command: ["redis-server", "--requirepass", "password"]  
  
volumes:  
  mongo_data: 